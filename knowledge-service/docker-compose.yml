services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: yixianghui-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?QDRANT_API_KEY is required}"
    volumes:
      - /var/lib/yixianghui-qdrant:/qdrant/storage
