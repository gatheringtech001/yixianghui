<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>逸享荟康养 P0 组件化原型</title>
    <style>
      :root {
        --accent: #701018;
        --accent-dark: #5e0d14;
        --ink: #111111;
        --text: #333333;
        --muted: #777777;
        --icon: #8a8a8a;
        --line: #e8e1d8;
        --paper: #ffffff;
        --warm: #f5f1ea;
        --soft: #f7f7f5;
        --cream: #fbf6ef;
        --shadow: 0 6px 18px rgba(17, 17, 17, 0.06);
        --w: 414px;
        --h: 783px;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #eee9e1;
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }

      body {
        display: grid;
        place-items: start center;
      }

      button {
        border: 0;
        padding: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .phone {
        width: min(100vw, var(--w));
        height: min(100vh, var(--h));
        min-height: min(100vh, var(--h));
        overflow: hidden;
        background: var(--soft);
      }

      .page {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--soft);
      }

      .page.white { background: var(--paper); }

      .content {
        flex: 1;
        overflow: auto;
        padding: 10px 14px 18px;
        scrollbar-width: none;
      }

      .content::-webkit-scrollbar { display: none; }

      .topbar {
        flex: 0 0 56px;
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: 44px 1fr 92px;
        align-items: center;
        gap: 4px;
        padding: 0 14px;
        border-bottom: 1px solid rgba(232, 225, 216, 0.7);
        background: var(--paper);
      }

      .topbar.compact {
        flex-basis: 44px;
      }

      .coins-page .content {
        padding-top: 0;
      }

      .topbar h1,
      .brand-header h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.25;
        font-weight: 800;
      }

      .topbar h1 {
        text-align: center;
      }

      .back {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
      }

      .top-action,
      .brand-pill {
        justify-self: end;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 28px;
        padding: 0 11px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 750;
        white-space: nowrap;
      }

      .brand-header {
        flex: 0 0 92px;
        padding: 14px 14px 0;
        background: var(--paper);
      }

      .brand-line {
        min-height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .brand-pill {
        justify-self: auto;
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .home-brand-header {
        flex-basis: 98px;
        padding-top: 10px;
      }

      .home-brand-line {
        min-height: 34px;
        justify-content: space-between;
      }

      .home-brand-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand-logo {
        width: 36px;
        height: 36px;
        display: block;
        border-radius: 7px;
      }

      .mini-capsule {
        width: 78px;
        height: 30px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        overflow: hidden;
        border: 1px solid rgba(112, 16, 24, 0.75);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--accent);
        font-size: 14px;
        font-weight: 800;
      }

      .mini-capsule button {
        height: 100%;
        display: grid;
        place-items: center;
      }

      .mini-capsule button + button {
        border-left: 1px solid rgba(112, 16, 24, 0.35);
      }

      .topbar .mini-capsule {
        justify-self: end;
        border-color: #1f1f1f;
        color: var(--ink);
      }

      .topbar .mini-capsule button + button {
        border-left-color: #d8d8d8;
      }

      .home-brand-header .mini-capsule {
        border-color: #1f1f1f;
        color: var(--ink);
      }

      .home-brand-header .mini-capsule button + button {
        border-left-color: #d8d8d8;
      }

      .search-bar {
        width: 100%;
        min-height: 38px;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding: 0 13px;
        border: 1px solid #eee9e1;
        border-radius: 999px;
        background: var(--soft);
        color: var(--muted);
        text-align: left;
        font-size: 14px;
      }

      .search-bar .search-action {
        margin-left: auto;
        color: var(--accent);
        font-weight: 750;
      }

      .btn {
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font-size: 13px;
        font-weight: 760;
        white-space: nowrap;
      }

      .btn.primary {
        background: var(--accent);
      }

      .btn.secondary {
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink);
      }

      .btn.outline-red {
        border: 1px solid var(--accent);
        background: var(--paper);
        color: var(--accent);
      }

      .btn.full { width: 100%; min-height: 50px; font-size: 18px; }

      .chip,
      .outline-chip,
      .status-pill {
        display: inline-flex;
        min-height: 24px;
        align-items: center;
        padding: 0 9px;
        border-radius: 5px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 720;
      }

      .chip { background: #f5e9e5; }

      .outline-chip {
        border: 1px solid rgba(139, 17, 29, 0.55);
        background: var(--paper);
      }

      .status-pill {
        min-height: 32px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 16px;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 16px 0 9px;
      }

      .section-title {
        margin: 0;
        font-size: 17px;
        line-height: 1.25;
        font-weight: 820;
      }

      .more {
        color: var(--muted);
        font-size: 12px;
      }

      .home-hero {
        width: 100%;
        height: 126px;
        position: relative;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 174px;
        gap: 10px;
        padding: 10px 10px 10px 13px;
        border: 1px solid rgba(112, 16, 24, 0.28);
        border-radius: 10px;
        background: var(--cream);
        text-align: left;
      }

      .hero-copy {
        text-align: left;
      }

      .home-hero h2,
      .card-title {
        margin: 0;
        color: var(--ink);
        font-size: 18px;
        line-height: 1.28;
        font-weight: 840;
      }

      .home-hero p,
      .meta {
        margin: 5px 0 0;
        color: #666666;
        font-size: 12px;
        line-height: 1.5;
      }

      .home-hero img {
        width: 174px;
        height: 98px;
        align-self: start;
        margin-top: 8px;
        border-radius: 8px;
        object-fit: cover;
      }

      .home-hero .chip { min-height: 20px; padding: 0 7px; font-size: 10px; }
      .home-hero .btn { margin-top: 6px; min-height: 28px; font-size: 12px; }

      .housekeeper {
        width: 100%;
        min-height: 62px;
        display: grid;
        grid-template-columns: 50px 1fr 76px;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        padding: 6px 8px 6px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        text-align: left;
      }

      .housekeeper-copy {
        text-align: left;
      }

      .housekeeper img,
      .avatar,
      .staff-avatar {
        border-radius: 50%;
        object-fit: cover;
      }

      .housekeeper img {
        width: 50px;
        height: 50px;
        object-fit: cover;
        object-position: center;
        background: #efe7de;
      }

      .home-page .content {
        padding-top: 0;
      }

      .home-page .housekeeper {
        margin-top: 6px;
      }

      .home-page .housekeeper .btn {
        width: 76px;
        min-height: 32px;
        align-self: center;
        margin-top: 0;
        padding: 0;
        font-size: 13px;
      }

      .profile-housekeeper {
        position: relative;
        overflow: visible;
        min-height: 84px;
        grid-template-columns: 88px 1fr auto;
        padding: 2px 12px;
        border-color: transparent;
        background: var(--cream);
        box-shadow: none;
      }

      .profile-housekeeper img {
        position: absolute;
        left: 10px;
        bottom: 0;
        width: 96px;
        height: 100px;
        border-radius: 0;
        object-fit: contain;
        object-position: center bottom;
        background: transparent;
        pointer-events: none;
      }

      .profile-housekeeper .housekeeper-copy {
        grid-column: 2;
      }

      .profile-housekeeper .btn {
        grid-column: 3;
        min-height: 34px;
        padding: 0 14px;
      }

      .entry-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 10px;
      }

      .home-page .entry-grid {
        margin-top: 6px;
      }

      .home-page .section-head {
        margin: 8px 0 7px;
      }

      .home-page .recommend-head {
        margin: 14px 0 7px;
      }

      .entry-card {
        width: 100%;
        position: relative;
        min-height: 78px;
        overflow: hidden;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 6px;
        padding: 8px 6px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--paper);
        color: var(--ink);
        text-align: center;
      }

      .entry-card::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.7) 52%, rgba(255,255,255,0.84) 100%);
      }

      .entry-card > img {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .entry-card .icon,
      .entry-card div {
        position: relative;
        z-index: 1;
      }

      .entry-card .icon {
        width: 34px;
        height: 34px;
        padding: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 0 0 1px rgba(17, 17, 17, 0.08);
      }

      .entry-card strong {
        display: block;
        font-size: 13px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .entry-card span {
        color: var(--muted);
        font-size: 10px;
        line-height: 1.25;
      }

      .city-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-auto-rows: 98px;
        gap: 7px;
      }

      .city-card {
        width: 100%;
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        color: #fff;
        text-align: left;
      }

      .city-card.large { grid-row: span 1; }

      .city-card img,
      .stay-card img,
      .listing-card img,
      .search-result-card img,
      .detail-cover {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .city-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.45));
        display: none;
      }

      .city-card strong,
      .city-card span {
        position: absolute;
        left: 10px;
        z-index: 1;
      }

      .city-card strong { bottom: 24px; font-size: 15px; }
      .city-card span { bottom: 9px; font-size: 11px; }

      .home-page .city-card strong,
      .home-page .city-card span {
        display: none;
      }

      .product-list,
      .activity-list,
      .support-list,
      .task-list {
        display: grid;
        align-content: start;
        gap: 10px;
      }

      .product-card {
        width: 100%;
        align-self: start;
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 9px;
        height: 86px;
        min-height: 86px;
        overflow: hidden;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        box-shadow: var(--shadow);
        text-align: left;
      }

      .product-card .btn,
      .stay-card .btn,
      .listing-card .btn,
      .search-result-card .btn {
        min-height: 32px;
        border-radius: 8px;
        font-size: 12px;
      }

      .stay-card .btn,
      .listing-card .btn {
        min-width: 92px;
        border-radius: 999px;
      }

      .product-card img {
        width: 140px;
        height: 72px;
        border-radius: 8px;
        object-fit: cover;
      }

      .product-card .card-title { font-size: 14px; }
      .product-card .meta { font-size: 10px; line-height: 1.2; margin-top: 2px; }
      .product-card .tags { margin-top: 3px; gap: 5px; }
      .product-card .chip { min-height: 16px; padding: 0 7px; font-size: 10px; }
      .product-card .price { font-size: 17px; }
      .product-card .price-row { margin-top: 2px; }
      .product-card .btn { min-height: 26px; padding: 0 13px; }

      .home-page .product-card {
        grid-template-columns: 148px 1fr;
        height: 94px;
        min-height: 94px;
        padding: 4px 5px 4px 4px;
      }

      .home-page .product-card img {
        width: 148px;
        height: 86px;
      }

      .home-page .product-card .btn {
        position: relative;
        top: -1px;
        width: 60px;
        min-height: 22px;
        margin-right: 7px;
        padding: 0;
      }

      .home-page .product-card .meta {
        visibility: hidden;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 7px;
      }

      .price-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
      }

      .price {
        color: var(--accent);
        font-size: 20px;
        line-height: 1;
        font-weight: 900;
      }

      .member-price {
        display: inline-flex;
        align-items: baseline;
        gap: 5px;
        color: var(--accent);
        white-space: nowrap;
      }

      .member-price span {
        font-size: 11px;
        font-weight: 760;
      }

      .switcher {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        margin-top: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
      }

      .switcher button {
        min-height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border-right: 1px solid var(--line);
        background: var(--paper);
        color: var(--text);
        font-size: 13px;
        font-weight: 760;
      }

      .switcher button:last-child { border-right: 0; }

      .switcher button.active {
        position: relative;
        background: var(--ink);
        color: #fff;
      }

      .switcher button.active::after {
        content: "";
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 0;
        height: 2px;
        border-radius: 99px;
        background: var(--accent);
      }

      .browse-grid {
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: 10px;
        margin: 12px -14px 0;
      }

      .browse-grid > .product-list,
      .browse-grid > .activity-list,
      .browse-grid > .education-list {
        padding-right: 14px;
      }

      .service-page .product-list {
        gap: 8px;
      }

      .service-page .listing-body {
        padding-top: 11px;
      }

      .service-page .stay-card .btn {
        position: relative;
        left: 7px;
        top: -1px;
        min-height: 31px;
      }

      .activity-page .brand-line {
        justify-content: flex-start;
      }

      .education-page .brand-line {
        justify-content: flex-start;
      }

      .activity-page .browse-grid {
        grid-template-columns: 84px 1fr;
        gap: 12px;
        margin-top: 24px;
      }

      .education-page .browse-grid {
        grid-template-columns: 84px 1fr;
        gap: 12px;
        margin-top: 24px;
      }

      .activity-page .category-rail button,
      .education-page .category-rail button {
        min-height: 46px;
      }

      .category-rail {
        min-height: 505px;
        padding-top: 10px;
        border-right: 1px solid #ede8df;
        background: #f6f3ed;
      }

      .category-rail button {
        position: relative;
        width: 100%;
        min-height: 54px;
        color: #333333;
        font-size: 13px;
        font-weight: 720;
      }

      .category-rail button.active {
        color: var(--accent);
      }

      .category-rail button.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 14px;
        width: 4px;
        height: 20px;
        border-radius: 99px;
        background: var(--accent);
      }

      .service-page .category-rail button.active::before {
        top: -7px;
        width: 3px;
        height: 60px;
        border-radius: 0 99px 99px 0;
      }

      .stay-card,
      .listing-card,
      .search-result-card {
        width: 100%;
        align-self: start;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        text-align: left;
      }

      .stay-card img { height: 150px; filter: saturate(1.16) contrast(0.96); }
      .listing-card img { height: 188px; }
      .listing-body { padding: 13px 14px 14px; }

      .search-result-card img { height: 158px; }
      .result-body { padding: 12px 13px 14px; }

      .search-page .content {
        padding: 2px 18px 18px;
      }

      .search-page .search-bar {
        min-height: 42px;
        margin-top: 0;
      }

      .search-page .product-list {
        gap: 14px;
      }

      .search-page .search-result-card img {
        height: 162px;
      }

      .search-page .result-body {
        padding: 12px 16px 15px;
      }

      .search-page .search-result-card .card-title {
        font-size: 18px;
      }

      .search-page .search-result-card .meta {
        margin-top: 6px;
        font-size: 13px;
        line-height: 1.45;
      }

      .search-page .search-result-card .price {
        font-size: 24px;
        font-weight: 780;
      }

      .search-page .search-result-card .price-row {
        margin-top: 10px;
      }

      .search-page .search-result-card .btn {
        min-height: 38px;
        min-width: 100px;
        margin-right: 4px;
        padding: 0 18px;
        border-radius: 8px;
        font-size: 14px;
      }

      .activity-meta {
        display: grid;
        gap: 8px;
        margin-top: 9px;
        color: #444;
        font-size: 12px;
      }

      .activity-meta div {
        display: grid;
        grid-template-columns: 72px 1fr;
        align-items: center;
        gap: 8px;
      }

      .activity-meta span { color: var(--muted); }

      .education-list {
        display: grid;
        align-content: start;
        gap: 10px;
      }

      .activity-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .activity-label .icon {
        width: 18px;
        height: 18px;
        color: var(--accent);
      }

      .detail-content {
        padding: 0;
      }

      .product-detail-page .content,
      .activity-detail-page .content {
        padding: 0 0 16px;
        background: var(--soft);
      }

      .detail-hero {
        width: 100%;
        height: 236px;
        overflow: hidden;
        background: #e7e1d7;
      }

      .detail-hero img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .activity-detail-page .detail-hero {
        height: 286px;
      }

      .detail-sheet {
        position: relative;
        margin: -18px 14px 0;
        padding: 18px 16px 17px;
        border: 1px solid rgba(232, 225, 216, 0.88);
        border-radius: 12px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .product-badge {
        position: absolute;
        left: 16px;
        top: -15px;
        min-height: 30px;
        display: inline-flex;
        align-items: center;
        padding: 0 11px;
        border-radius: 4px;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        font-weight: 820;
      }

      .detail-sheet h2 {
        margin: 6px 0 10px;
        color: var(--ink);
        font-size: 21px;
        line-height: 1.28;
        font-weight: 880;
      }

      .detail-sheet p {
        margin: 0;
        color: #555555;
        font-size: 14px;
        line-height: 1.72;
      }

      .detail-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .detail-tags .outline-chip {
        min-height: 26px;
        border-color: #d5c9bb;
        color: var(--text);
      }
